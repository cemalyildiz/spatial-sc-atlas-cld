name: Refresh catalog

on:
  schedule:
    # Every Monday at 04:17 UTC. Off-the-hour to be polite to NCBI.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "How to deliver the refreshed catalog"
        required: true
        default: pr
        type: choice
        options:
          - pr      # open a pull request for review (default, and what the schedule uses)
          - direct  # commit straight to the default branch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest GEO + ArrayExpress
        env:
          # Optional: add a repository secret named NCBI_API_KEY to raise the
          # NCBI rate limit from 3 to 10 requests per second.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/harvest.py

      - name: Summarise
        id: summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.loads(pathlib.Path("data/meta.json").read_text())
          print(f"## Catalog refreshed\n")
          print(f"- **{m['total']:,}** datasets total")
          print(f"- **{m.get('new_since_last_run', 0):,}** new since the last run")
          print(f"- Generated {m['generated']}\n")
          print("| Modality | Count |\n| --- | ---: |")
          for k, v in m["by_modality"].items():
              print(f"| {k} | {v:,} |")
          PY
          echo "total=$(python -c "import json;print(json.load(open('data/meta.json'))['total'])")" >> "$GITHUB_OUTPUT"
          echo "new=$(python -c "import json;print(json.load(open('data/meta.json')).get('new_since_last_run',0))")" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- data/
          fi

      - name: Commit directly
        if: steps.diff.outputs.changed == 'true' && inputs.mode == 'direct'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh catalog: ${{ steps.summary.outputs.total }} datasets (${{ steps.summary.outputs.new }} new)"
          git push

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true' && inputs.mode != 'direct'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="catalog-refresh/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/
          git commit -m "Refresh catalog: ${{ steps.summary.outputs.total }} datasets (${{ steps.summary.outputs.new }} new)"

          # actions/checkout fetches only the branch it checks out, so there is no
          # origin/<BRANCH> tracking ref for a refresh branch and a bare
          # --force-with-lease has nothing to lease against - git rejects the push
          # as "stale info". Read the remote tip with ls-remote instead and lease
          # against exactly that, so a concurrent write still can't be clobbered.
          REMOTE_SHA="$(git ls-remote --heads origin "$BRANCH" | cut -f1)"
          if [ -n "$REMOTE_SHA" ]; then
            git push --force-with-lease="$BRANCH:$REMOTE_SHA" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          {
            printf 'Automated harvest from NCBI GEO and EBI ArrayExpress.\n\n'
            printf -- '- **%s** datasets in the catalog\n' "${{ steps.summary.outputs.total }}"
            printf -- '- **%s** accessions not present in the previous catalog\n\n' "${{ steps.summary.outputs.new }}"
            printf 'Accession, title, description, organism, sample count, release date and PubMed ID come verbatim from the source databases. Modality, platform, disease and tissue are derived by the rules in `scripts/harvest.py` - skim the diff for obvious mislabels before merging.\n'
          } > /tmp/pr-body.md

          BASE="${{ github.event.repository.default_branch }}"
          COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/${BASE}...${BRANCH}?expand=1"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "A pull request for $BRANCH is already open; it now carries the latest harvest."
          elif gh pr create --title "Refresh catalog (${{ steps.summary.outputs.new }} new datasets)" \
                            --body-file /tmp/pr-body.md --head "$BRANCH" --base "$BASE"; then
            echo "Pull request opened for $BRANCH."
          else
            # Creating pull requests from Actions is off by default: Settings ->
            # Actions -> General -> "Allow GitHub Actions to create and approve pull
            # requests". The refreshed branch is pushed either way, so hand over the
            # compare link rather than failing a harvest that actually succeeded.
            echo "::warning::Could not open a pull request automatically - the refreshed branch $BRANCH is pushed and ready to review."
            {
              echo "### Catalog refresh ready for review"
              echo ""
              echo "The harvest succeeded and \`$BRANCH\` is pushed, but a pull request could not be opened automatically."
              echo ""
              echo "**[Open the pull request]($COMPARE)**"
              echo ""
              echo "To have this happen by itself, enable *Allow GitHub Actions to create and approve pull requests* in Settings -> Actions -> General."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
